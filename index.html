<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js (better than local) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
</head>

<body>

<script>
  function showMessage(message){
    let hud = document.querySelector("#hud");
    if(hud){
      hud.setAttribute('value', message);
    }
  }

  AFRAME.registerComponent('ar-logic',{
    init: function(){
      showMessage('AR logic working');
    },

    tick: function(){
      let cam = document.querySelector("#cam");

      if(!cam || !cam.components.raycaster){
        return;
      }

      let circle = document.querySelector("#circle");
      let intersection = cam.components.raycaster.getIntersection(circle);

      if(!intersection){
        return;
      }

      circle.setAttribute('position', intersection.point);
    }
  });

  // 👉 Touch to place model
  window.addEventListener('touchstart', function(e){
    if(e.touches.length === 1){
      let box = document.querySelector("#box");
      let circle = document.querySelector("#circle");

      let pos = circle.getAttribute('position');
      pos.y += 0.1; // lift slightly

      box.setAttribute('position', pos);
    }
  });

  // 👉 ROTATE + ZOOM LOGIC
  let initialDistance = null;
  let initialScale = 1;

  window.addEventListener('touchmove', function(e){
    let box = document.querySelector("#box");

    // 👉 Rotate (one finger)
    if(e.touches.length === 1){
      let rotation = box.getAttribute('rotation');
      rotation.y += 1; // adjust speed here
      box.setAttribute('rotation', rotation);
    }

    // 👉 Zoom (two fingers)
    if(e.touches.length === 2){
      let dx = e.touches[0].pageX - e.touches[1].pageX;
      let dy = e.touches[0].pageY - e.touches[1].pageY;
      let distance = Math.sqrt(dx*dx + dy*dy);

      if(!initialDistance){
        initialDistance = distance;
        initialScale = box.getAttribute('scale').x;
      }

      let scaleFactor = distance / initialDistance;
      let newScale = initialScale * scaleFactor;

      box.setAttribute('scale', {
        x: newScale,
        y: newScale,
        z: newScale
      });
    }
  });

  window.addEventListener('touchend', function(){
    initialDistance = null;
  });
</script>

<a-scene ar ar-logic>

  <!-- Camera -->
  <a-camera 
    id="cam" 
    raycaster="objects: #circle"
    cursor="rayOrigin: mouse">

    <a-text 
      id="hud"
      value="Starting..."
      position="0 -0.1 -0.5"
      align="center"
      width="2">
    </a-text>

  </a-camera>

  <!-- Ground marker -->
  <a-ring
    id="circle"
    rotation="-90 0 0"
    inner-radius="0.05"
    outer-radius="0.06"
    position="0 0 -1"
    color="red">
  </a-ring>

  <!-- 3D Model -->
  <a-entity
    id="box"
    gltf-model="url(arCar.glb)"
    scale="50 50 50"
    position="0 0 -2"
    rotation="0 180 0">
  </a-entity>

  <!-- Lighting -->
  <a-light type="ambient" intensity="1"></a-light>
  <a-light type="directional" position="1 2 1"></a-light>

</a-scene>

</body>
</html>
